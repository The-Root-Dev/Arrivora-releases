name: Notifier la publication d'une release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notifier-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Notifier le backend
        env:
          API_URL: ${{ secrets.API_URL }}
          NOTIFICATION_API_TOKEN: ${{ secrets.NOTIFICATION_API_TOKEN }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          if [ -z "$API_URL" ]; then
            echo "Le secret API_URL est manquant."
            exit 1
          fi

          if [ -z "$NOTIFICATION_API_TOKEN" ]; then
            echo "Le secret NOTIFICATION_API_TOKEN est manquant."
            exit 1
          fi

          payload=$(jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg url "$RELEASE_URL" \
            '{version: $version, url: $url}')

          response_file=$(mktemp)
          http_status=$(curl --silent --show-error \
            --request POST \
            "${API_URL%/}/envoyer-notification-version" \
            --header "Content-Type: application/json" \
            --header "X-Notification-Token: $NOTIFICATION_API_TOKEN" \
            --data "$payload" \
            --output "$response_file" \
            --write-out '%{http_code}')

          echo "Réponse du backend (HTTP $http_status) :"
          cat "$response_file"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            exit 1
          fi

          if ! jq -e '.envoyee == true' "$response_file" >/dev/null; then
            echo "Le backend n'a pas confirmé l'envoi de la notification."
            exit 1
          fi
